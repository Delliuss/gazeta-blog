<!DOCTYPE html>
<html>
<head>
    <title>Редактировать отзыв</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" style="font-size: 1.5rem; font-weight: bold; color: var(--primary); text-decoration: none;">
                Гастрономические путешествия
            </a>
            <div class="nav-links">
                <a href="/profile">Профиль</a>
                <a href="/logout">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="form-container fade-in">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Редактировать отзыв</h2>
        
        {{if .IsAdmin}}
        <div style="background-color: #fff3cd; color: #856404; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem;">
            ⚠ Вы редактируете этот пост как администратор
        </div>
        {{end}}
        
        <form method="POST">
            <input type="hidden" name="id" value="{{.ID}}">

            <div class="form-group">
                <label class="form-label">Название заведения</label>
                <input type="text" name="title" class="form-control" value="{{.Title}}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Местоположение (город, страна)</label>
                <input type="text" name="location" class="form-control" value="{{.Location}}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Оценка (1-5)</label>
                <select name="rating" class="form-control" required>
                    <option value="1" {{if eq .Rating 1}}selected{{end}}>1 - Ужасно</option>
                    <option value="2" {{if eq .Rating 2}}selected{{end}}>2 - Плохо</option>
                    <option value="3" {{if eq .Rating 3}}selected{{end}}>3 - Нормально</option>
                    <option value="4" {{if eq .Rating 4}}selected{{end}}>4 - Хорошо</option>
                    <option value="5" {{if eq .Rating 5}}selected{{end}}>5 - Отлично</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">URL изображения</label>
                <input type="text" name="image_url" class="form-control" value="{{.ImageURL}}">
                {{if .ImageURL}}
                <div style="margin-top: 0.5rem;">
                    <img src="{{.ImageURL}}" style="max-width: 200px; border-radius: 4px;">
                </div>
                {{end}}
            </div>

            <div class="form-group">
                <label class="form-label">Отзыв</label>
                <textarea name="content" class="form-control" required>{{.Content}}</textarea>
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" name="is_recommended" {{if .IsRecommended}}checked{{end}}>
                    Рекомендую это место
                </label>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 2rem;">
                <a href="/profile" class="btn btn-outline">Отмена</a>
                <button type="submit" class="btn btn-primary">Сохранить изменения</button>
            </div>
        </form>
    </div>
</body>
</html>
